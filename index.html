(function(){

     'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js'],

    ['https://lib.baomitu.com/react/18.2.0/umd/react.production.min.js',
     'https://lib.baomitu.com/react-dom/18.2.0/umd/react-dom.production.min.js']
  ];
  var idx = 0;
  function tryNext(){
    if(idx >= cdns.length){
      document.getElementById('root').innerHTML = '<div style="padding:40px;color:#fff;text-align:center;font-family:sans-serif"><h2>加载失败</h2><p style="opacity:0.7;margin-top:10px">请检查网络连接后刷新</p></div>';
      return;
    }
    var pair = cdns[idx++];
    var s1 = document.createElement('script');

      var s2 = document.createElement('script');
      s2.src = pair[1];
      s2.onload = function(){
        // React 加载完成,启动游戏
        if(window.__startGame) window.__startGame();
      };
      s2.onerror = tryNext;
      document.head.appendChild(s2);
    };
    s1.onerror = tryNext;
    document.head.appendChild(s1);
  }
  tryNext();
})();
</script>
<script>
window.__startGame = function(){
var useState=React.useState,useEffect=React.useEffect,useRef=React.useRef,useCallback=React.useCallback;
var h=React.createElement;

var SUITS=["s","h","d","c"],RANKS=["2","3","4","5","6","7","8","9","T","J","Q","K","A"];
var RV={};RANKS.forEach(function(r,i){RV[r]=i+2});

function mkDeck(){var d=[];for(var i=0;i<SUITS.length;i++)for(var j=0;j<RANKS.length;j++)d.push(RANKS[j]+SUITS[i]);return d}
function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}return b}

function eval7(cards){
  var ranks=cards.map(function(c){return RV[c[0]]});
  var rc={};ranks.forEach(function(r){rc[r]=(rc[r]||0)+1});
  var sg={};cards.forEach(function(c){if(!sg[c[1]])sg[c[1]]=[];sg[c[1]].push(RV[c[0]])});
  var fs=null;for(var s in sg)if(sg[s].length>=5)fs=s;
  if(fs){var sr=Object.keys(sg[fs].reduce(function(o,v){o[v]=1;return o},{})).map(Number).sort(function(a,b){return b-a});var sf=strHi(sr);if(sf)return[8,sf]}
  var g=Object.keys(rc).map(function(k){return[+k,rc[k]]}).sort(function(a,b){return b[1]-a[1]||b[0]-a[0]});
  if(g[0][1]===4){var q=g[0][0];return[7,q,Math.max.apply(null,ranks.filter(function(r){return r!==q}))]}
  if(g[0][1]===3&&g[1]&&g[1][1]>=2)return[6,g[0][0],g[1][0]];
  if(fs){var top=sg[fs].sort(function(a,b){return b-a}).slice(0,5);return[5].concat(top)}
  var u=Object.keys(ranks.reduce(function(o,v){o[v]=1;return o},{})).map(Number).sort(function(a,b){return b-a});
  var sh=strHi(u);if(sh)return[4,sh];
  if(g[0][1]===3){var t=g[0][0];return[3,t].concat(ranks.filter(function(r){return r!==t}).sort(function(a,b){return b-a}).slice(0,2))}
  if(g[0][1]===2&&g[1]&&g[1][1]===2){var p1=g[0][0],p2=g[1][0];return[2,p1,p2,Math.max.apply(null,ranks.filter(function(r){return r!==p1&&r!==p2}))]}
  if(g[0][1]===2){var p=g[0][0];return[1,p].concat(ranks.filter(function(r){return r!==p}).sort(function(a,b){return b-a}).slice(0,3))}
  return[0].concat(ranks.sort(function(a,b){return b-a}).slice(0,5));
}
function strHi(sd){var s=sd.slice();if(s.indexOf(14)>=0)s.push(1);for(var i=0;i<=s.length-5;i++){var slc=s.slice(i,i+5);var uniq={};slc.forEach(function(v){uniq[v]=1});if(s[i]-s[i+4]===4&&Object.keys(uniq).length===5)return s[i]}return 0}
function cmpE(a,b){for(var i=0;i<Math.max(a.length,b.length);i++){var x=a[i]||0,y=b[i]||0;if(x!==y)return x-y}return 0}
function hCode(hand){var a=hand[0],b=hand[1];var r1=RV[a[0]],r2=RV[b[0]];var hi=r1>=r2?a[0]:b[0],lo=r1>=r2?b[0]:a[0];if(a[0]===b[0])return hi+lo;return hi+lo+(a[1]===b[1]?"s":"o")}
function hStr(hand){var a=hand[0],b=hand[1];var r1=RV[a[0]],r2=RV[b[0]],hi=Math.max(r1,r2),lo=Math.min(r1,r2),su=a[1]===b[1],pa=r1===r2;var s=0;if(pa)s=55+(hi-2)*4;else{s=(hi-2)*3.2+(lo-2)*1.8;var g=hi-lo-1;if(g===0)s+=7;else if(g===1)s+=4;else if(g===2)s+=2;if(su)s+=9;if(hi===14)s+=7;if(hi===13)s+=4;if(hi>=12&&lo>=10)s+=5}return s}
function hCat(hand){var s=hStr(hand);if(s>=90)return"\u9876\u7ea7Premium";if(s>=70)return"\u5f3a\u724cStrong";if(s>=50)return"\u4e2d\u7b49Medium";if(s>=30)return"\u6295\u673aSpec";return"\u5f31\u724cTrash"}

function eqVsR(hero,board,thresh,iters){
  iters=iters||300;
  var dead={};hero.concat(board).forEach(function(c){dead[c]=1});
  var rem=mkDeck().filter(function(c){return !dead[c]});
  var combos=[];for(var i=0;i<rem.length;i++)for(var j=i+1;j<rem.length;j++){if(hStr([rem[i],rem[j]])>=thresh)combos.push([rem[i],rem[j]])}

  for(var k=0;k<iters;k++){
    var v=combos[Math.floor(Math.random()*combos.length)];
    var sr=rem.filter(function(c){return c!==v[0]&&c!==v[1]});
    var p=shuf(sr);var fb=board.concat(p.slice(0,5-board.length));
    var he=eval7(hero.concat(fb)),ve=eval7(v.concat(fb));var c=cmpE(he,ve);

function detectD(hero,board){var cards=hero.concat(board);var sc={};cards.forEach(function(c){sc[c[1]]=(sc[c[1]]||0)+1});var fd=false;for(var k in sc)if(sc[k]===4)fd=true;var rs={};cards.forEach(function(c){rs[RV[c[0]]]=1});var ranks=Object.keys(rs).map(Number).sort(function(a,b){return a-b});var rla=ranks.indexOf(14)>=0?[1].concat(ranks):ranks;var oesd=false,gs=false;for(var i=0;i<rla.length-3;i++){var w=rla.slice(i,i+4);if(w.length===4&&w[3]-w[0]===3)oesd=true}for(var lo=1;lo<=10;lo++){var n=[lo,lo+1,lo+2,lo+3,lo+4];var hv=0;for(var x=0;x<5;x++)if(rla.indexOf(n[x])>=0)hv++;if(hv===4)gs=true}return{fd:fd,oesd:oesd,gs:gs}}
function anaBoard(board){if(!board.length)return null;var ranks=board.map(function(c){return RV[c[0]]}).sort(function(a,b){return b-a});var sc={};board.forEach(function(c){sc[c[1]]=(sc[c[1]]||0)+1});var ms=Math.max.apply(null,Object.values(sc));var rc={};ranks.forEach(function(r){rc[r]=(rc[r]||0)+1});var pa=false;for(var k in rc)if(rc[k]>=2)pa=true;var sp=ranks[0]-ranks[ranks.length-1];var co=board.length>=3&&sp<=4;var t="\u5e72\u71e5",ts=0;if(ms>=3){t="\u4e09\u540c\u82b1";ts+=3}else if(ms===2){t="\u4e24\u540c\u82b1";ts+=1}if(co){t+="\u00b7\u8fde\u63a5";ts+=2}if(pa){t+="\u00b7\u914d\u5bf9";ts+=1}if(ts>=3)t="\u6e7f\u6da6\u00b7"+t;return{t:t,pa:pa,ms:ms,hi:RANKS[ranks[0]-2],hb:ranks[0]>=11}}

var BB=2,SB=1,START=200,MAXR=2000;

function aiDec(gs,mod,hh){

  var r=Math.random(),rep=[];var ms=hStr(aiHand),code=hCode(aiHand),cat=hCat(aiHand);
